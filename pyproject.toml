[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxion"
version = "0.1.0"
description = "Code and measurement pipeline for a study of frozen structure-predictor latents as a space for learning protein dynamics"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Arjun Chatterjee"}]
dependencies = [
  "torch>=2.4",
  "torchdiffeq>=0.2.5",
  "numpy>=1.26,<2",
  "scipy>=1.13",
  "pandas>=2.2",
  "h5py>=3.10",
  "MDAnalysis>=2.9",
  "filelock>=3.13",
  "tqdm>=4.66",
  "requests>=2.31",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
extract = ["chai-lab==0.6.1"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
